<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f5f3ee">
    <title>סטודיו פיקסלים</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="studio">
        <header class="studio-header">
            <a class="brand" href="#" aria-label="סטודיו פיקסלים, דף הבית">
                <span class="brand-mark" aria-hidden="true">✳</span>
                <span>פיקסל<span class="brand-light">יה</span></span>
            </a>
            <span class="header-note"><span class="status-dot"></span> המקום הקטן לרעיונות גדולים</span>
        </header>

        <section class="workspace" aria-labelledby="page-title">
            <div class="intro">
                <div class="eyebrow"><span></span> סטודיו לציור דיגיטלי</div>
                <h1 id="page-title">כל פיקסל<br><span>מתחיל ברעיון.</span></h1>
                <p>בחרו צבע, תנו לדמיון להוביל, וציירו משהו משלכם.</p>
                <div class="canvas-detail">
                    <span class="detail-icon" aria-hidden="true">▦</span>
                    <span><strong>16 × 16</strong><small>קנבס הפיקסלים שלכם</small></span>
                </div>
            </div>

            <section class="drawing-card" aria-label="לוח ציור">
                <div class="card-top">
                    <div>
                        <span class="card-kicker">היצירה שלי</span>
                        <h2>בואו נצייר</h2>
                    </div>
                    <span class="live-badge"><span></span> מוכן ליצירה</span>
                </div>

                <div class="toolbar" aria-label="כלי ציור">
                    <label class="color-control" for="colorPicker">
                        <span class="control-label">צבע מברשת</span>
                        <span class="color-input-wrap">
                            <input type="color" id="colorPicker" value="#7357d8" aria-label="בחירת צבע">
                            <span>בחירת צבע</span>
                        </span>
                    </label>
                    <span class="toolbar-divider" aria-hidden="true"></span>
                    <button id="eraserButton" class="tool-button eraser-button" type="button" aria-pressed="false">
                        <span class="tool-icon" aria-hidden="true">⌫</span>
                        <span>מחק</span>
                    </button>
                    <button id="clearButton" class="tool-button clear-button" type="button">
                        <span class="tool-icon" aria-hidden="true">↺</span>
                        <span>נקה הכול</span>
                    </button>
                </div>

                <div class="canvas-wrap">
                    <div id="pixelCanvas" class="pixel-grid" role="grid" aria-label="קנבס ציור בגודל 16 על 16"></div>
                </div>

                <footer class="canvas-footer">
                    <span class="hint-icon" aria-hidden="true">✦</span>
                    <span>לחצו או גררו על הקנבס כדי לצייר</span>
                    <span class="footer-sparkle" aria-hidden="true">✳</span>
                </footer>
            </section>
        </section>

        <footer class="page-footer">
            <span>נוצר בשביל הרגע שבו רעיון פוגש פיקסל</span>
            <span class="footer-heart" aria-hidden="true">♥</span>
        </footer>
    </main>

    <script src="index.js"></script>
</body>
</html>
